name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & Test
        run: mvn verify -B
        env:
          SPRING_AI_OPENAI_API_KEY: test-key

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  backend-security:
    name: Backend — Dependency Security Scan
    runs-on: ubuntu-latest
    needs: backend-test
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: OWASP Dependency Check
        if: ${{ env.NVD_API_KEY != '' }}
        run: |
          mvn org.owasp:dependency-check-maven:13.0.0:check \
            -DnvdApiKey="$NVD_API_KEY" \
            -DfailBuildOnCVSS=9 \
            -DskipTestScope=true \
            -B
        working-directory: backend

      - name: Note unavailable NVD credentials
        if: ${{ env.NVD_API_KEY == '' }}
        run: echo "NVD_API_KEY is not configured; Trivy remains the blocking dependency scan."

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          exit-code: 1

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test

      - name: Build (production)
        run: npm run build:prod

  # ─── Docker Build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: platform-radar-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: platform-radar-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Summary ─────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.backend-test.result }}" = "success" ] && \
             [ "${{ needs.frontend-test.result }}" = "success" ]; then
            echo "All checks passed!"
          else
            echo "Some checks failed."
            exit 1
          fi
